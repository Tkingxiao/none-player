[versions]
# AGP 9.3.x：compileSdk 36 官方支持（8.7.3 只测到 35，构建时报警告）
# 兼容矩阵（官方 release notes 核实）：Gradle >= 9.5.0 / JDK 17 / Build Tools 36.0.0 / KGP >= 2.2.10
agp = "9.3.1"
# AGP 9 内置 Kotlin 支持：不再需要应用 kotlin-android 插件，
# 但 KGP 版本仍需 >= 2.2.10（AGP 自带运行期依赖会兜到这个版本）
kotlin = "2.2.10"
# KSP 自 2.3.0 起与 Kotlin 编译器版本解耦；AGP 9 内置 Kotlin 支持自 2.3.1 引入，
# 2.3.3 起才摆脱已废弃的 KGP compilerOptions API → 取矩阵推荐的 2.3.6。
# 注意：新版 KSP 不再使用 "2.0.21-1.0.28" 这种 Kotlin 绑定格式。
ksp = "2.3.6"
coroutines = "1.9.0"
composeBom = "2024.12.01"
activityCompose = "1.9.3"
navigationCompose = "2.8.5"
lifecycle = "2.8.7"
coreKtx = "1.15.0"
datastore = "1.1.1"
# Room（§8.3 持久层）：4.6+ 起内置 SQLite 驱动、KSP2 需 room.generateKotlin=true（见模块 build 脚本）
room = "2.7.2"
media3 = "1.11.1"
# Media3Avi（dburckh/Media3Avi）：为 media3 补齐 AVI 解封装（OpenDML/AVIX + indx/ix 索引、
# MP42/MP43、MJPEG、更多 H.264 fourCC）并提供 MJPEG 软解渲染器。
# 仅 JitPack 有产物（无 Maven Central）；其 AAR 编译基线是 media3 1.7.1，
# 但所用 API（Extractor/TrackOutput/DecoderVideoRenderer 等）在 1.11.1 上未变，
# 且本项目的 media3 版本更高 → Gradle 版本仲裁取 1.11.1。
media3avi = "2.7.1"
# NextLib（anilbeesetti/nextlib）：为 media3 提供 FFmpeg 扩展渲染器（硬解优先、硬解不支持时回退软解）
# 与运行期解码器切换（DecoderManager）。版本号格式为 `<media3 版本>-<nextlib 版本>`，
# 1.11.1-0.16.0 与本项目 media3 1.11.1 精确对应（改 media3 版本时必须同步改这里）。
# ⚠ 该库为 GPL-3.0；其捆绑的 FFmpeg 为 LGPL-3.0（configure 未开 --enable-gpl）。
# 视频解码器仅 h264/hevc/mpeg2video/mpegvideo/vp8/vp9/av1(libdav1d)，
# 音频为 vorbis/opus/flac/alac/mp3/aac/ac3/eac3/dca/mlp/truehd 等；
# 不含 mpeg4(Xvid/DivX)、wmv2/vc1、mjpeg —— 与 §12.9.3 的专利结论一致（VC-1/WMV2 不引入）。
nextlib = "1.11.1-0.16.0"
coil = "2.7.0"
junit = "4.13.2"
# plugin-danmaku 的 JVM 单测补充：android.jar 里 org.xmlpull / org.json 是运行时桩
kxml2 = "2.3.0"
android-org-json = "20240303"
# 插桩测试（androidTest）——§12.9.2 QPel 探测 harness 使用
androidxTest = "1.6.2"
androidxTestExt = "1.2.1"
# androidx-window 不在 compose BOM 内 → 必须自带版本项（§13.2）
window = "1.5.0"

[libraries]
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

ksp-api = { group = "com.google.devtools.ksp", name = "symbol-processing-api", version.ref = "ksp" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-extractor = { group = "androidx.media3", name = "media3-extractor", version.ref = "media3" }
media3-datasource = { group = "androidx.media3", name = "media3-datasource", version.ref = "media3" }
# AVI 解封装增强（AviExtractorsFactory）+ MJPEG 软解渲染器（MjpegRenderersFactory）
media3avi = { group = "com.github.dburckh", name = "Media3Avi", version.ref = "media3avi" }
# FFmpeg 扩展渲染器（NextRenderersFactory）+ 运行期解码器切换（DecoderManager）
nextlib-media3ext = { group = "io.github.anilbeesetti", name = "nextlib-media3ext", version.ref = "nextlib" }

coil = { group = "io.coil-kt", name = "coil", version.ref = "coil" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
coil-video = { group = "io.coil-kt", name = "coil-video", version.ref = "coil" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# E52 形态判定层依赖（§13.2）：别名沿用现有命名风格（compose 系不带 androidx- 前缀）
# 注：§13.2 建议的别名 `compose-material3-window-size-class` 会被 Gradle 拒绝
# （"class" 是保留字，无法生成访问器），故改用下面不含 class 的等价别名。
compose-material3-window-size = { group = "androidx.compose.material3", name = "material3-window-size-class" }
androidx-window = { group = "androidx.window", name = "window", version.ref = "window" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-core" }
# Compose 行为级单测（Robolectric 下跑 createComposeRule）：版本由 compose BOM 管
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
# E132 行为级回归：转屏交接的档位翻转与静音窗要能在**真实 recomposition + SideEffect 顺序**
# 下取证（纯函数层只能钉判据本体）。Robolectric 4.14 支持到 SDK 34，故用例一律 @Config(sdk=[34])。
robolectric = { group = "org.robolectric", name = "robolectric", version = "4.14.1" }
kxml2 = { group = "net.sf.kxml", name = "kxml2", version.ref = "kxml2" }
android-org-json = { group = "org.json", name = "json", version.ref = "android-org-json" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTest" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
