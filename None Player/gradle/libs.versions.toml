[versions]
# AGP 9.3.x：compileSdk 36 官方支持（8.7.3 只测到 35，构建时报警告）
# 兼容矩阵（官方 release notes 核实）：Gradle >= 9.5.0 / JDK 17 / Build Tools 36.0.0 / KGP >= 2.2.10
agp = "9.3.1"
# AGP 9 内置 Kotlin 支持：不再需要应用 kotlin-android 插件，
# 但 KGP 版本仍需 >= 2.2.10（AGP 自带运行期依赖会兜到这个版本）
kotlin = "2.2.10"
# KSP 自 2.3.0 起与 Kotlin 编译器版本解耦；AGP 9 内置 Kotlin 支持自 2.3.1 引入，
# 2.3.3 起才摆脱已废弃的 KGP compilerOptions API → 取矩阵推荐的 2.3.6。
# 注意：新版 KSP 不再使用 "2.0.21-1.0.28" 这种 Kotlin 绑定格式。
ksp = "2.3.6"
coroutines = "1.9.0"
composeBom = "2024.12.01"
activityCompose = "1.9.3"
navigationCompose = "2.8.5"
lifecycle = "2.8.7"
coreKtx = "1.15.0"
datastore = "1.1.1"
media3 = "1.11.1"
coil = "2.7.0"
junit = "4.13.2"
# androidx-window 不在 compose BOM 内 → 必须自带版本项（§13.2）
window = "1.5.0"

[libraries]
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

ksp-api = { group = "com.google.devtools.ksp", name = "symbol-processing-api", version.ref = "ksp" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-extractor = { group = "androidx.media3", name = "media3-extractor", version.ref = "media3" }
media3-datasource = { group = "androidx.media3", name = "media3-datasource", version.ref = "media3" }

coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
coil-video = { group = "io.coil-kt", name = "coil-video", version.ref = "coil" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# E52 形态判定层依赖（§13.2）：别名沿用现有命名风格（compose 系不带 androidx- 前缀）
# 注：§13.2 建议的别名 `compose-material3-window-size-class` 会被 Gradle 拒绝
# （"class" 是保留字，无法生成访问器），故改用下面不含 class 的等价别名。
compose-material3-window-size = { group = "androidx.compose.material3", name = "material3-window-size-class" }
compose-material3-adaptive-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite" }
androidx-window = { group = "androidx.window", name = "window", version.ref = "window" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-core" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
